# 开发环境配置

# Primary Database Configuration (主数据源)
spring.datasource.url=jdbc:mysql://localhost:3306/primary_database?useSSL=false&serverTimezone=UTC&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Doris Database Configuration (报表数据源)
spring.datasource.doris.url=jdbc:mysql://localhost:9030/doris_database?useSSL=false&serverTimezone=UTC&characterEncoding=utf8
spring.datasource.doris.username=root
spring.datasource.doris.password=123456
spring.datasource.doris.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Server Configuration
server.port=8080
server.servlet.context-path=/dentist-report

# Logging Configuration (开发环境详细日志)
logging.level.root=INFO
logging.level.com.example=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Doris Connection Pool Configuration
spring.datasource.doris.hikari.maximum-pool-size=20
spring.datasource.doris.hikari.minimum-idle=5
spring.datasource.doris.hikari.connection-timeout=30000
spring.datasource.doris.hikari.idle-timeout=600000
spring.datasource.doris.hikari.max-lifetime=1800000