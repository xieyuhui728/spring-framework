# Primary Database Configuration (默认数据源)
spring.datasource.url=jdbc:mysql://localhost:3306/primary_database?useSSL=false&serverTimezone=UTC&characterEncoding=utf8
spring.datasource.username=primary_username
spring.datasource.password=primary_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Doris Database Configuration (用于报表查询)
spring.datasource.doris.url=jdbc:mysql://doris-host:9030/doris_database?useSSL=false&serverTimezone=UTC&characterEncoding=utf8
spring.datasource.doris.username=doris_username
spring.datasource.doris.password=doris_password
spring.datasource.doris.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# 多数据源配置说明：
# primary为主数据源，doris为报表数据源

# Server Configuration
server.port=8080

# Logging
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.example=DEBUG